<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documenti | Travel Explorer</title>
    <meta name="theme-color" content="#0c6ea8">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="icon" href="icons/favicon-64.png">
    <link rel="stylesheet" href="style.css">

    <style>
        body {
            margin: 0;
            background: #f5f5f7;
            color: #1d1d1f;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .module-page {
            max-width: 820px;
            margin: 0 auto;
            padding: 20px 16px 80px;
        }

        .module-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 16px;
        }

        .module-header h1 {
            margin: 0;
            font-size: 28px;
        }

        .module-kicker {
            color: #8e8e93;
            font-size: 11px;
        }

        .panel {
            background: white;
            border-radius: 22px;
            padding: 16px;
            margin-bottom: 13px;
            box-shadow: 0 5px 20px rgba(0,0,0,.05);
        }

        .panel h2 {
            margin: 0 0 12px;
            font-size: 18px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 9px;
        }

        .field {
            display: grid;
            gap: 5px;
        }

        .field label {
            color: #77777c;
            font-size: 10px;
            font-weight: 700;
        }

        input,
        select,
        textarea {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #dedee3;
            border-radius: 13px;
            background: white;
            padding: 11px 12px;
            font: inherit;
            font-size: 13px;
            color: #1d1d1f;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .button {
            min-height: 46px;
            border: 0;
            border-radius: 14px;
            background: #1d1d1f;
            color: white;
            font-weight: 800;
            cursor: pointer;
            padding: 0 14px;
        }

        .button.secondary {
            background: #f1f1f3;
            color: #1d1d1f;
        }

        .button.small {
            min-height: 34px;
            padding: 0 10px;
            font-size: 10px;
        }

        .button-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 9px;
            margin-bottom: 13px;
        }

        .summary-card {
            background: white;
            border-radius: 18px;
            padding: 14px;
            box-shadow: 0 4px 14px rgba(0,0,0,.045);
        }

        .summary-card span {
            display: block;
            color: #8e8e93;
            font-size: 9px;
            margin-bottom: 4px;
        }

        .summary-card strong {
            display: block;
            font-size: 17px;
        }

        .item-list {
            display: grid;
            gap: 8px;
        }

        .item-card {
            padding: 13px;
            border-radius: 16px;
            background: #f5f5f7;
        }

        .item-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
        }

        .item-card h3 {
            margin: 0;
            font-size: 13px;
        }

        .item-card p {
            margin: 5px 0 0;
            color: #6f6f74;
            font-size: 10px;
            line-height: 1.45;
        }

        .tag-row {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 8px;
        }

        .tag {
            padding: 6px 8px;
            border-radius: 9px;
            background: white;
            color: #5e5e63;
            font-size: 9px;
            font-weight: 700;
            border: 0;
            text-decoration: none;
            cursor: pointer;
        }

        .empty {
            padding: 15px;
            border-radius: 14px;
            background: #f5f5f7;
            color: #77777c;
            font-size: 11px;
            line-height: 1.45;
        }

        .section-note {
            margin-top: 8px;
            color: #8e8e93;
            font-size: 9px;
            line-height: 1.45;
        }

        .owner-select {
            width: auto;
            min-width: 112px;
            padding: 7px 8px;
            border-radius: 10px;
            font-size: 10px;
            background: white;
        }

        .doc-filter.active {
            background: #1d1d1f;
            color: white;
        }

        @media (min-width: 620px) {
            .summary-grid {
                grid-template-columns: repeat(4, minmax(0, 1fr));
            }
        }
    </style>
</head>

<body>

<div class="module-page">

    <header class="module-header">
        <a href="index.html" class="back-button">←</a>

        <div>
            <div class="module-kicker">Mauritius 2026</div>
            <h1>📄 Documenti</h1>
        </div>
    </header>

    <section id="documents-summary" class="summary-grid"></section>

    <section class="panel">
        <h2>＋ Aggiungi documento</h2>

        <div class="grid-2">

            <div class="field">
                <label>Categoria</label>

                <select id="doc-category">
                    <option>Volo</option>
                    <option>Hotel</option>
                    <option>Auto</option>
                    <option>Assicurazione</option>
                    <option>Attività</option>
                    <option>Passaporto / ID</option>
                    <option>Altro</option>
                </select>
            </div>

            <div class="field">
                <label>Documento di</label>

                <select id="doc-owner">
                    <option value="shared">👥 Entrambi</option>
                    <option value="michele">👤 Michele</option>
                    <option value="denise">👤 Denise</option>
                </select>
            </div>

        </div>

        <div class="field" style="margin-top:9px;">
            <label>Titolo</label>
            <input
                id="doc-title"
                type="text"
                placeholder="Es. Voucher Veranda Tamarin"
            >
        </div>

        <div class="field" style="margin-top:9px;">
            <label>File</label>

            <input
                id="doc-file"
                type="file"
                accept="application/pdf,image/*"
            >
        </div>

        <div class="field" style="margin-top:9px;">
            <label>Nota</label>

            <textarea
                id="doc-note"
                placeholder="Numero prenotazione, orario, riferimento..."
            ></textarea>
        </div>

        <div class="button-row">
            <button
                id="add-document"
                class="button"
            >
                Salva offline
            </button>
        </div>

        <div class="section-note">
            I documenti vecchi senza assegnatario vengono considerati automaticamente
            “Entrambi”. Puoi cambiare Michele / Denise / Entrambi anche dopo il salvataggio.
        </div>
    </section>

    <section class="panel">
        <h2>📁 Archivio</h2>

        <div
            class="button-row"
            style="margin-top:0;margin-bottom:12px;"
        >
            <button
                class="button small secondary doc-filter active"
                data-owner-filter="all"
            >
                Tutti
            </button>

            <button
                class="button small secondary doc-filter"
                data-owner-filter="michele"
            >
                👤 Michele
            </button>

            <button
                class="button small secondary doc-filter"
                data-owner-filter="denise"
            >
                👤 Denise
            </button>

            <button
                class="button small secondary doc-filter"
                data-owner-filter="shared"
            >
                👥 Entrambi
            </button>
        </div>

        <div
            id="document-list"
            class="item-list"
        ></div>
    </section>

</div>

<script src="travel-store.js"></script>
<script src="documents.js"></script>

<script src="pwa-register.js"></script>
</body>
</html>
