<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diario | Travel Explorer</title>
    <link rel="stylesheet" href="style.css">
    <style>


        body {
            margin: 0;
            background: #f5f5f7;
            color: #1d1d1f;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        .module-page {
            max-width: 820px;
            margin: 0 auto;
            padding: 20px 16px 80px;
        }
        .module-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 16px;
        }
        .module-header h1 { margin: 0; font-size: 28px; }
        .module-kicker { color: #8e8e93; font-size: 11px; }
        .panel {
            background: white;
            border-radius: 22px;
            padding: 16px;
            margin-bottom: 13px;
            box-shadow: 0 5px 20px rgba(0,0,0,.05);
        }
        .panel h2 { margin: 0 0 12px; font-size: 18px; }
        .muted { color: #77777c; font-size: 11px; line-height: 1.45; }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 9px;
        }
        .field { display: grid; gap: 5px; }
        .field label {
            color: #77777c;
            font-size: 10px;
            font-weight: 700;
        }
        input, select, textarea {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #dedee3;
            border-radius: 13px;
            background: white;
            padding: 11px 12px;
            font: inherit;
            font-size: 13px;
            color: #1d1d1f;
        }
        textarea { min-height: 100px; resize: vertical; }
        .button {
            min-height: 46px;
            border: 0;
            border-radius: 14px;
            background: #1d1d1f;
            color: white;
            font-weight: 800;
            cursor: pointer;
            padding: 0 14px;
        }
        .button.secondary { background: #f1f1f3; color: #1d1d1f; }
        .button.danger { background: #fff0ef; color: #9e2d25; }
        .button.small { min-height: 34px; padding: 0 10px; font-size: 10px; }
        .button-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 9px;
            margin-bottom: 13px;
        }
        .summary-card {
            background: white;
            border-radius: 18px;
            padding: 14px;
            box-shadow: 0 4px 14px rgba(0,0,0,.045);
        }
        .summary-card span {
            display: block;
            color: #8e8e93;
            font-size: 9px;
            margin-bottom: 4px;
        }
        .summary-card strong { display: block; font-size: 17px; }
        .empty {
            padding: 15px;
            border-radius: 14px;
            background: #f5f5f7;
            color: #77777c;
            font-size: 11px;
            line-height: 1.45;
        }
        .item-list { display: grid; gap: 8px; }
        .item-card {
            padding: 13px;
            border-radius: 16px;
            background: #f5f5f7;
        }
        .item-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
        }
        .item-card h3 { margin: 0; font-size: 13px; }
        .item-card p {
            margin: 5px 0 0;
            color: #6f6f74;
            font-size: 10px;
            line-height: 1.45;
        }
        .tag-row {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 8px;
        }
        .tag {
            padding: 5px 7px;
            border-radius: 9px;
            background: white;
            color: #5e5e63;
            font-size: 9px;
            font-weight: 700;
            border: 0;
            text-decoration: none;
            cursor: pointer;
        }
        .section-note {
            margin-top: 8px;
            color: #8e8e93;
            font-size: 9px;
        }
        @media (min-width: 620px) {
            .summary-grid {
                grid-template-columns: repeat(4, minmax(0, 1fr));
            }
        }

    
        .poi-search-results {
            display: grid;
            gap: 6px;
            margin-top: 8px;
            max-height: 240px;
            overflow-y: auto;
        }
        .poi-search-button {
            border: 0;
            border-radius: 12px;
            background: #f5f5f7;
            padding: 10px;
            text-align: left;
            cursor: pointer;
        }
        .selected-pois {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }
        .rating {
            font-size: 13px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
<div class="module-page">

    <header class="module-header">
        <a href="index.html" class="back-button">←</a>
        <div>
            <div class="module-kicker">Mauritius 2026</div>
            <h1>📔 Diario</h1>
        </div>
    </header>

    <div id="diary-status" class="panel" style="padding:12px 14px;">
        <div class="muted">Avvio diario…</div>
    </div>

    <section id="diary-summary" class="summary-grid"></section>

    <section class="panel">
        <h2>✍️ Nuova giornata / nota</h2>

        <div class="grid-2">
            <div class="field">
                <label>Data</label>
                <input id="diary-date" type="date">
            </div>

            <div class="field">
                <label>Valutazione</label>
                <select id="diary-rating">
                    <option value="5">★★★★★</option>
                    <option value="4">★★★★☆</option>
                    <option value="3">★★★☆☆</option>
                    <option value="2">★★☆☆☆</option>
                    <option value="1">★☆☆☆☆</option>
                </select>
            </div>
        </div>

        <div class="field" style="margin-top:9px;">
            <label>Titolo</label>
            <input id="diary-title" type="text" placeholder="Es. Chamarel e Le Morne">
        </div>

        <div class="field" style="margin-top:9px;">
            <label>Diario</label>
            <textarea id="diary-text" placeholder="Cosa abbiamo fatto, cosa ci è piaciuto, imprevisti, persone incontrate..."></textarea>
        </div>

        <div class="grid-2" style="margin-top:9px;">
            <div class="field">
                <label>Piatti / bevande provati</label>
                <input id="diary-food" type="text" placeholder="Dholl puri, alouda...">
            </div>

            <div class="field">
                <label>Meteo percepito</label>
                <input id="diary-weather" type="text" placeholder="Sole, vento forte, pioggia breve...">
            </div>
        </div>

        <div class="field" style="margin-top:9px;">
            <label>Cerca POI visitati tra i 400</label>
            <input id="poi-search" type="search" placeholder="Cerca un luogo...">
            <div id="poi-search-results" class="poi-search-results"></div>
            <div id="selected-pois" class="selected-pois"></div>
        </div>

        <div class="field" style="margin-top:9px;">
            <label>Foto (opzionale)</label>
            <input id="diary-photo" type="file" accept="image/*">
        </div>

        <div class="button-row">
            <button id="save-diary-entry" class="button">Salva nel diario</button>
            <button id="cancel-diary-edit" class="button secondary" type="button" style="display:none;">Annulla modifica</button>
        </div>
        <div class="section-note">Se la giornata è stata chiusa dall'Itinerario, la troverai già nel Diario: premi “Completa” per aggiungere commenti, foto, cibo e voto senza reinserire le tappe.</div>
    </section>

    <section class="panel">
        <h2>📚 Diario di viaggio</h2>
        <div id="diary-list" class="item-list"></div>
    </section>

</div>

<script src="travel-store.js"></script>
<script src="diary.js"></script>
</body>
</html>
