<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0c6ea8">
    <title>Travel Explorer — Offline</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #f5f5f7;
            color: #1d1d1f;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        .card {
            width: min(480px, 100%);
            padding: 26px;
            border-radius: 26px;
            background: white;
            box-shadow: 0 12px 40px rgba(0,0,0,.08);
        }
        .icon { font-size: 42px; }
        h1 { margin: 10px 0 8px; font-size: 28px; }
        p { color: #6e6e73; line-height: 1.5; font-size: 13px; }
        .actions {
            display: grid;
            gap: 8px;
            margin-top: 18px;
        }
        a {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 48px;
            border-radius: 15px;
            background: #1d1d1f;
            color: white;
            text-decoration: none;
            font-weight: 800;
            font-size: 13px;
        }
        a.secondary {
            background: #f1f1f3;
            color: #1d1d1f;
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="icon">✈️</div>
        <h1>Sei offline</h1>
        <p>
            Travel Explorer continua a funzionare con i contenuti già salvati.
            Meteo live, mappe non ancora visualizzate e servizi online torneranno disponibili appena rientra la connessione.
        </p>

        <div class="actions">
            <a href="./index.html">🏠 Torna alla Home</a>
            <a href="./itinerary.html" class="secondary">📅 Itinerario</a>
            <a href="./here.html" class="secondary">📍 Sono qui</a>
        </div>
    </main>
</body>
</html>
